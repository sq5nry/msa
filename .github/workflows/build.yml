name: build

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # Unit tests run on the simulator and recorded data; no MSA or libusb is needed.
      - run: mvn -B -ntp verify
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'windows-latest'
        with:
            name: msa-windows-jars
            path: |
               msa-tools/target/msa-probe.jar
               msa-gui/target/msa-gui.jar
